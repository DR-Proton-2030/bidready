version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Explicitly write server-side secrets to .env.production so the Next.js
        # SSR runtime can read them (Amplify console env vars are build-time only).
        - echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> .env.production
        - echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
